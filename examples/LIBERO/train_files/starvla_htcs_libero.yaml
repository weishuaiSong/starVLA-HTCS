run_id: htcs_libero_4suite
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_HTCS
is_debug: false
version_id: "0.1"

framework:
  name: HTCS
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
  # vision_adapter: null  → auto-detect by inspecting hf_model structure;
  # set to a registered short name (e.g. 'qwen3_5', 'qwen3_vl', 'siglip')
  # to force a specific adapter when auto-detect can't or shouldn't pick.
  vision_adapter: null
  stage1:
    keep_ratio: 0.20
    grid_size: 14                                      # codec grid; adapter must agree
  stage2:
    K: 8
    n_heads: 4
    # d_patch is auto-set from the chosen vision adapter at runtime.
    # Leave 1152 as a fallback for adapters that may not override.
    d_patch: 1152
  action_model:
    action_model_type: MLP                             # phase 1; switch to "DiT" later
    action_dim: 7
    state_dim: 7
    action_horizon: 8
  aux_loss:
    lambda_aux: 0.0                                    # action loss only — disable task classifier
    n_tasks: 40                                        # LIBERO 4 suites = 40 tasks

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all                               # joint 4-suite training (D5)
    action_type: delta_qpos
    sequential_step_sampling: False
    history_len: 16                                    # HTCS T=16
    per_device_batch_size: 8                           # 8 GPU x 8 = 64 global on L20 48GB
    load_all_data_for_training: true
    video_backend: torchvision_av
    enable_htcs_codec: true                            # triggers HTCSCodecLoader

trainer:
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 5000
  learning_rate:
    base: 3.0e-04
    qwen_vl_interface: 1.0e-05
    stage1: 3.0e-04
    stage2: 3.0e-04
    action_model: 3.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 3.0e-05
  # The vision tower is already frozen by the active vision adapter
  # (see HTCS.__init__ → adapter.freeze()); leaving this list empty
  # avoids a brittle string-path freeze that would silently no-op when
  # the backbone (and thus the visual-tower attribute path) changes.
  freeze_modules: ''
  max_grad_norm: 1.0
  gradient_clipping: 1.0                              # accelerator.clip_grad_norm_ value used by _train_step
  logging_frequency: 100
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.05
